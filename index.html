<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151221"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><title>Post Studio | X 投稿アシスタント</title><style>
*{box-sizing:border-box}body{margin:0;background:#100e18;color:#f5f2ff;font:15px system-ui,sans-serif}header{border-bottom:1px solid #30283e;padding:22px max(20px,calc((100% - 1080px)/2));display:flex;align-items:center;gap:12px;white-space:nowrap}.logo{background:#8052dc;border-radius:12px;padding:10px;font-weight:900}small,.muted{color:#b5abc9}main{max-width:1120px;margin:auto;padding:28px 20px}h1{font-size:30px;margin:0 0 8px}h2{font-size:17px;margin:0 0 18px}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:28px}.panel{background:#1b1728;border:1px solid #352d48;border-radius:20px;padding:22px;margin-bottom:18px}textarea,input,button{font:inherit}textarea{width:100%;min-height:180px;resize:vertical;background:#100e18;border:1px solid #443757;color:inherit;padding:15px;border-radius:12px}button,a.btn{border:1px solid #493b60;background:#29213b;color:inherit;border-radius:10px;padding:12px 15px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#8052dc;border-color:#8052dc;font-weight:700;width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.drop{display:block;border:1px dashed #77619a;border-radius:12px;text-align:center;padding:24px;margin-top:12px;cursor:pointer}.drop.over{background:#35274c}.media{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.tile{position:relative;min-width:0}.tile img,.tile video{width:100%;height:135px;object-fit:contain;background:#100e18;border-radius:10px}.tile button{position:absolute;right:5px;top:5px;padding:4px 10px;background:#100e18}.tile small{display:block;overflow-wrap:anywhere}.preview{white-space:pre-wrap;overflow-wrap:anywhere;min-height:60px;margin:16px 0}.status{min-height:45px;line-height:1.6;color:#d7c5ff}.count{text-align:right;margin:8px 0}.pill{font-size:12px;color:#c6b1ff;border:1px solid #574379;border-radius:99px;padding:5px 10px;margin-left:auto}.templates button{margin:4px 4px 4px 0}footer{color:#a69bb9;font-size:12px;line-height:1.7}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #c6a7ff;outline-offset:3px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:20px 14px}header{padding:15px}.panel{padding:16px}h1{font-size:25px}.pill{display:none}}
</style><header><span class="logo">PS</span><div><strong>Post Studio</strong><br><small>X 投稿アシスタント</small></div><span class="pill">API 不要 · 手動投稿</span></header><main><h1>次のポストを、ここから。</h1><div class="muted">文章とメディアを準備して、Xで投稿を仕上げましょう。</div><div class="layout"><section><div class="panel"><h2>01　投稿を作成</h2><label for="body">本文</label><textarea id="body" placeholder="いま伝えたいことを書こう…"></textarea><div class="count muted" id="count"></div><div class="templates"><button data-template="おはようみんな！">おはよう</button><button data-template="配信を開始しました！&#10;遊びに来てね！">配信告知</button><button data-template="今日もありがとうございました！">おつかれさま</button></div><div class="actions"><button id="save">下書き保存</button><button id="clear">クリア</button></div></div><div class="panel"><h2>02　メディア</h2><label class="drop" id="drop">＋ 画像・GIF・動画を選択<br><small>ドラッグ＆ドロップにも対応</small><input id="files" type="file" accept="image/*,video/*" multiple hidden></label><div id="media" class="media"></div><small>静止画は最大4枚、GIF・動画は単独で選択できます。</small></div></section><aside><div class="panel"><h2>投稿プレビュー</h2><strong>あなたのアカウント</strong><div class="preview" id="preview"></div><div class="media" id="previewMedia"></div><small>実際のXの表示とは異なります。</small></div><div class="panel"><h2>03　Xへ引き継ぐ</h2><button class="primary" id="share">共有メニューを開く</button><div class="actions"><button id="intent">本文を入れてXを開く</button><button id="copy">本文コピー</button><button id="copyImage">画像コピー</button></div><p class="status" id="status" role="status"></p><footer>共有先でXを選択してください。端末やXアプリによっては本文・画像の一方が引き継がれない場合があります。投稿はXで手動確定してください。ファイルは外部サーバーへ送信しません。</footer></div></aside></div></main><script>
const $=id=>document.getElementById(id), body=$('body');let files=[],urls=[];const status=t=>$('status').textContent=t;try{body.value=localStorage.getItem('post-studio-draft')||''}catch{}function render(){ $('count').textContent=Array.from(body.value).length+'文字（Xの換算とは異なります）';$('preview').textContent=body.value||'本文のプレビュー';$('share').disabled=!body.value.trim()&&!files.length;$('intent').disabled=!body.value.trim();$('copy').disabled=!body.value.trim();$('copyImage').disabled=files.length!==1||!/^image\/(png|jpeg|webp)$/.test(files[0]?.type||'');}function media(){urls.forEach(URL.revokeObjectURL);urls=[];for(const id of ['media','previewMedia']){$(id).replaceChildren();files.forEach((f,i)=>{const tile=document.createElement('div');tile.className='tile';const el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=URL.createObjectURL(f);urls.push(el.src);if(el.tagName==='VIDEO'){el.controls=true;el.preload='metadata'}else el.alt=f.name;tile.append(el);if(id==='media'){const b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label',f.name+'を削除');b.onclick=()=>{files.splice(i,1);media()};const s=document.createElement('small');s.textContent=f.name;tile.append(b,s)}$(id).append(tile)})}render()}function add(list){const next=[...files,...list];if(next.some(f=>! /^(image|video)\//.test(f.type))||next.length>4||(next.some(f=>f.type==='image/gif'||f.type.startsWith('video/'))&&next.length>1)){status('静止画4枚まで、またはGIF・動画1件を選択してください。');return}files=next;media();status('メディアを選択しました。')}body.oninput=render;$('files').onchange=e=>{add(e.target.files);e.target.value=''};const drop=$('drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');add(e.dataTransfer.files)};document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{body.value+=(body.value?'\n':'')+b.dataset.template;render()});$('save').onclick=()=>{try{localStorage.setItem('post-studio-draft',body.value);status('本文の下書きを端末に保存しました。画像は保存されません。')}catch{status('下書きを保存できませんでした。')}};$('clear').onclick=()=>{if(confirm('本文と選択画像をクリアしますか？')){body.value='';files=[];try{localStorage.removeItem('post-studio-draft')}catch{}media();status('クリアしました。')}};$('share').onclick=async()=>{const data={};if(body.value.trim())data.text=body.value;if(files.length)data.files=files;if(!navigator.share||(files.length&&(!navigator.canShare||!navigator.canShare(data)))){status('この環境では一括共有できません。本文を入れてXを開き、画像を手動添付してください。');return}try{await navigator.share(data);status('共有処理が完了しました。Xで内容を確認して投稿してください。投稿済みかは確認できません。')}catch(e){status(e.name==='AbortError'?'共有をキャンセルしました。':'共有できませんでした。本文コピーや手動添付をお試しください。')}};$('intent').onclick=()=>{window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(body.value),'_blank','noopener,noreferrer');status(files.length?'Xで画像を手動添付してください。':'Xで内容を確認してください。')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(body.value);status('本文をコピーしました。')}catch{status('コピーできません。本文を選択してコピーしてください。')}};$('copyImage').onclick=async()=>{try{const f=files[0];const promise=(async()=>{const im=await createImageBitmap(f);const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);im.close();return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error()),'image/png'))})();await navigator.clipboard.write([new ClipboardItem({'image/png':promise})]);status('画像をコピーしました。Xで貼り付けてください。')}catch{status('画像コピーに対応していません。Xで手動添付してください。')}};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
